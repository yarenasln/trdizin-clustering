services:
  postgres:
    image: postgres:16
    container_name: trdizin_clustering_postgres

    environment:
      POSTGRES_DB: trdizin_clustering_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - /data/postgres_data:/var/lib/postgresql/data  

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d trdizin_clustering_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: trdizin_qdrant
  
    volumes:
      - /data/qdrant_storage:/qdrant/storage
    restart: always

  app:
    build: .
    container_name: trdizin_clustering_app
    working_dir: /app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trdizin_clustering_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      

    ports:
      - "5001:5001"

    volumes:
      - .:/app
      - /data/app_embeddings:/app/embeddings  

    

    command: python dashboard/app.py

  caddy:
    image: caddy:latest
    container_name: trdizin_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /data/caddy/data:/data      
      - /data/caddy/config:/config  

