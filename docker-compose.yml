services:

  postgres:
    image: postgres:16
    container_name: trdizin_clustering_postgres

    environment:
      POSTGRES_DB: trdizin_clustering_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d trdizin_clustering_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    container_name: trdizin_clustering_app
    working_dir: /app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trdizin_clustering_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    ports:
      - "5001:5001"

    volumes:
      - .:/app

    gpus: all

    command: python dashboard/app.py


volumes:
  postgres_data: